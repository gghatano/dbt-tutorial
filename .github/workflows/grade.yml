name: Grade exercise

# 学習者の push / PR で起動し、対象 Exercise を grading.yaml に従って採点。
# - workflow_dispatch: 手動起動 + exercise を input で指定
# - push: branch 名から exercise を抽出 (`exercise-NN-...`)、無ければ skip
# - pull_request: PR タイトルから抽出、無ければ skip

on:
  workflow_dispatch:
    inputs:
      exercise:
        description: "Exercise id (例: 06, 06-exposures, または full grading.yaml path)"
        required: true
        type: string

  push:
    branches-ignore:
      - main
      - develop

  pull_request:
    branches:
      - develop
      - main

jobs:
  grade:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: analytics_user
          POSTGRES_PASSWORD: analytics_password
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: analytics
      DB_USER: dbt_user
      DB_PASSWORD: dbt_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve exercise id
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "exercise=${{ github.event.inputs.exercise }}" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          # branch / PR title から `exercise-NN[-...]` パターンを拾う
          ref="${GITHUB_REF_NAME:-}"
          title="${{ github.event.pull_request.title || '' }}"
          for s in "$ref" "$title"; do
              hit=$(echo "$s" | grep -oE 'exercise[-_]?[0-9]{2}([-_a-zA-Z0-9]*)' | head -1 || true)
              if [ -n "$hit" ]; then
                  ex=$(echo "$hit" | sed -E 's/^exercise[-_]?//')
                  echo "exercise=$ex" >> "$GITHUB_OUTPUT"
                  echo "Detected exercise: $ex"
                  exit 0
              fi
          done
          echo "No exercise id found in branch '$ref' or PR title; skipping grader."
          echo "exercise=" >> "$GITHUB_OUTPUT"

      - name: Skip if no exercise detected
        if: steps.resolve.outputs.exercise == ''
        run: echo "Nothing to grade. Branch / PR title needs to contain 'exercise-NN'."

      - name: Setup Python
        if: steps.resolve.outputs.exercise != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        if: steps.resolve.outputs.exercise != ''
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python deps
        if: steps.resolve.outputs.exercise != ''
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt
          uv pip install pyyaml

      - name: Wait for Postgres
        if: steps.resolve.outputs.exercise != ''
        run: |
          for i in $(seq 1 20); do
              pg_isready -h localhost -p 5432 -U analytics_user -d analytics && break
              sleep 2
          done

      - name: Bootstrap schemas / roles
        if: steps.resolve.outputs.exercise != ''
        env:
          PGPASSWORD: analytics_password
        run: psql -h localhost -U analytics_user -d analytics -f scripts/ci/bootstrap_schemas.sql

      - name: Generate dummy data
        if: steps.resolve.outputs.exercise != ''
        run: .venv/bin/python scripts/generate_dummy_data.py

      - name: Load raw data
        if: steps.resolve.outputs.exercise != ''
        run: .venv/bin/python scripts/load_raw_data.py

      - name: dbt deps
        if: steps.resolve.outputs.exercise != ''
        working-directory: dbt
        run: ../.venv/bin/dbt deps --profiles-dir .

      - name: dbt build (MVP baseline)
        if: steps.resolve.outputs.exercise != ''
        working-directory: dbt
        run: ../.venv/bin/dbt build --profiles-dir .

      - name: Run grader
        if: steps.resolve.outputs.exercise != ''
        id: grade
        run: |
          mkdir -p build
          set +e
          .venv/bin/python scripts/grader/grade.py \
              --exercise "${{ steps.resolve.outputs.exercise }}" \
              --report build/grading-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat build/grading-report.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Comment on PR
        if: steps.resolve.outputs.exercise != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'build/grading-report.md';
            if (!fs.existsSync(path)) {
                console.log('No report file; skipping PR comment.');
                return;
            }
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
            });

      - name: Fail job if grading failed
        if: steps.resolve.outputs.exercise != '' && steps.grade.outputs.exit_code != '0'
        run: |
          echo "Grading reported NG (exit ${{ steps.grade.outputs.exit_code }})."
          exit 1
