# Grading definition for Exercise 02 (商品評価マートの作成).
# Run by: python scripts/grader/grade.py --exercise 02

exercise: 02-mart-product-rating
title: "Exercise 02: 商品評価マートの作成"
passing_score: 80   # need >= 80% of total points to PASS

# Files the learner is expected to create (UX hint only).
expects_learner_files:
  - dbt/models/exercises/02/int_product_reviews.sql
  - dbt/models/exercises/02/mart_top_rated_products.sql
  - dbt/models/exercises/02/schema.yml

checks:
  # ----- structural (manifest-only, no DB needed) -----

  - id: parse-success
    description: "dbt parse が成功する (構文 OK)"
    type: dbt_command
    command: ["dbt", "parse"]
    points: 10

  - id: int-product-reviews-file-exists
    description: "dbt/models/exercises/02/int_product_reviews.sql が存在する"
    type: file_exists
    path: dbt/models/exercises/02/int_product_reviews.sql
    points: 5

  - id: mart-top-rated-products-file-exists
    description: "dbt/models/exercises/02/mart_top_rated_products.sql が存在する"
    type: file_exists
    path: dbt/models/exercises/02/mart_top_rated_products.sql
    points: 5

  - id: mart-top-rated-lineage
    description: "mart_top_rated_products が int_product_reviews と mart_product_sales に依存している (DAG 結合)"
    type: manifest_lineage
    node: model.local_analytics.mart_top_rated_products
    upstream_min_count: 2
    upstream_must_include:
      - model.local_analytics.int_product_reviews
      - model.local_analytics.mart_product_sales
    points: 20

  # ----- data-level (requires DB + dbt build done) -----

  - id: int-and-mart-tests-pass
    description: "dbt test --select int_product_reviews mart_top_rated_products が全件 PASS"
    type: dbt_test_passes
    select: int_product_reviews mart_top_rated_products
    min_pass: 5
    points: 25

  - id: mart-top-rated-row-count
    description: "marts.mart_top_rated_products が 1 行以上ある (avg_rating>=4.0 かつ review_count>=10 の商品)"
    type: sql_assert
    sql: "SELECT count(*) FROM marts.mart_top_rated_products"
    op: gte
    expected: 1
    points: 20

  - id: mart-top-rated-avg-rating-bounds
    description: "mart_top_rated_products.avg_rating の最小値が 4.0 以上 (フィルタ条件が効いている)"
    type: sql_assert
    sql: "SELECT min(avg_rating) FROM marts.mart_top_rated_products"
    op: gte
    expected: 4.0
    points: 15
