# Grading definition for 100-knock Topic 4, Problem 4-1 (int_order_details_100knock with grain).
# Run by: python scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-4-intermediate/4-1-int-order-details.grading.yaml
#
# 採点方針:
#   - 構造チェック (file_exists / parse / manifest / lineage) で 65 点
#   - データチェック (dbt_test_passes / sql_assert) で 35 点
#   - 学習者は 4-1 で int_order_details_100knock.sql + schema.yml をコミット済み
#
# 前提:
#   - Topic ② ③ 完了 (raw_100knock source + stg_*_100knock 4 本が存在)
#   - 学習者は dbt/models/100-knock/topic-4/int_order_details_100knock.sql を作成
#   - dbt parse / dbt run / dbt test がローカルまたは CI で走る環境

exercise: 100-knock-4-1-int-order-details
title: "100-knock 4-1: int_order_details_100knock を grain 宣言付きで作る"
passing_score: 80

expects_learner_files:
  - dbt/models/100-knock/topic-4/int_order_details_100knock.sql
  - dbt/models/100-knock/topic-4/schema.yml

checks:
  # ----- 構造チェック (65 点) -----

  - id: int-order-details-file-exists
    description: "dbt/models/100-knock/topic-4/int_order_details_100knock.sql が存在する"
    type: file_exists
    path: dbt/models/100-knock/topic-4/int_order_details_100knock.sql
    points: 10

  - id: parse-success
    description: "dbt parse が成功する (新 model の SQL / Jinja 構文 OK)"
    type: dbt_command
    command: ["dbt", "parse"]
    points: 15

  - id: int-order-details-node-registered
    description: "manifest に model.local_analytics.int_order_details_100knock が登録されている"
    type: manifest_node_exists
    node: model.local_analytics.int_order_details_100knock
    points: 15

  - id: int-order-details-lineage
    description: "上流に stg_*_100knock 4 本 (customers / products / orders / stores) が含まれる"
    type: manifest_lineage
    node: model.local_analytics.int_order_details_100knock
    upstream_min_count: 4
    upstream_must_include:
      - model.local_analytics.stg_customers_100knock
      - model.local_analytics.stg_products_100knock
      - model.local_analytics.stg_orders_100knock
      - model.local_analytics.stg_stores_100knock
    points: 25

  # ----- データチェック (35 点) -----

  - id: int-order-details-tests-pass
    description: "dbt test --select int_order_details_100knock が PASS (unique on order_id を含む)"
    type: dbt_test_passes
    select: int_order_details_100knock
    min_pass: 2
    points: 20

  - id: int-order-details-row-count
    description: "intermediate.int_order_details_100knock が 10000 行ある (= stg_orders_100knock 行数)"
    type: sql_assert
    sql: "SELECT count(*) FROM intermediate.int_order_details_100knock"
    op: eq
    expected: 10000
    points: 15
