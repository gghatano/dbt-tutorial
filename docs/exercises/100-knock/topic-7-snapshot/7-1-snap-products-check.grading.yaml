# Grading definition for 100-knock Topic 7, Problem 7-1 (snap_products check strategy).
# Run by: python scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-7-snapshot/7-1-snap-products-check.grading.yaml
#
# 採点方針:
#   - 構造チェック (file_exists / parse / manifest_node / manifest_config) で 60 点
#   - データチェック (shell_command で dbt snapshot 実行 + sql_assert で行数) で 40 点
#
# 前提:
#   - Topic ② 2-1〜2-2 完了 (raw_100knock source 宣言済み, raw.products に 100 行)
#   - 学習者が Step 0 で snapshots schema を作成済み
#     (CREATE SCHEMA IF NOT EXISTS snapshots AUTHORIZATION dbt_user;)
#   - 学習者が dbt/snapshots/100-knock/topic-7/snap_products_100knock.sql を作成

exercise: 100-knock-7-1-snap-products-check
title: "100-knock 7-1: snap_products を check strategy で書く"
passing_score: 80

expects_learner_files:
  - dbt/snapshots/100-knock/topic-7/snap_products_100knock.sql

checks:
  # ----- 構造チェック (60 点) -----

  - id: snap-file-exists
    description: "dbt/snapshots/100-knock/topic-7/snap_products_100knock.sql が存在する"
    type: file_exists
    path: dbt/snapshots/100-knock/topic-7/snap_products_100knock.sql
    points: 10

  - id: parse-success
    description: "dbt parse が成功する (snapshot ブロックの構文 OK)"
    type: dbt_command
    command: ["dbt", "parse"]
    points: 10

  - id: snap-node-registered
    description: "manifest に snapshot.local_analytics.snap_products_100knock が登録されている"
    type: manifest_node_exists
    node: snapshot.local_analytics.snap_products_100knock
    points: 15

  - id: snap-config-check-strategy
    description: "snap_products_100knock の config が strategy=check / unique_key=product_id / target_schema=snapshots を持つ"
    type: manifest_config
    node: snapshot.local_analytics.snap_products_100knock
    expected:
      strategy: check
      unique_key: product_id
      target_schema: snapshots
    points: 25

  # ----- データチェック (40 点) -----

  - id: snap-run-success
    description: "dbt snapshot --select snap_products_100knock が成功する (PASS=1)"
    type: shell_command
    command: ["bash", "-c", "cd dbt && ../.venv/bin/dbt snapshot --profiles-dir . --select snap_products_100knock"]
    expect_stdout_match: "PASS=1"
    points: 20

  - id: snap-row-count-100
    description: "snapshots.snap_products_100knock が 100 行ある (1 回目 snapshot 後)"
    type: sql_assert
    sql: "SELECT count(*)::int FROM snapshots.snap_products_100knock"
    op: eq
    expected: 100
    points: 20
