# Grading for 100-knock Topic 9 / Q3: incremental の 3 strategy (append/delete+insert/merge) を比較。
# Run: python3 scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-9-performance/9-3-incremental-strategies.grading.yaml
#
# 採点は「3 model + 比較ドキュメント」 を確認するのみ (行数の検証は環境差を避けるため見送り)。

exercise: 100-knock-9-3-incremental-strategies
title: "9-3: incremental の 3 strategy (append/delete+insert/merge) を比較、冪等性を理解"
passing_score: 80

expects_learner_files:
  - dbt/models/100-knock/topic-9/mart_orders_incremental_append_100knock.sql
  - dbt/models/100-knock/topic-9/mart_orders_incremental_delete_insert_100knock.sql
  - dbt/models/100-knock/topic-9/mart_orders_incremental_merge_100knock.sql
  - docs/exercises/100-knock/topic-9-performance/strategy-comparison.md

checks:
  - id: append-model-exists
    description: "append strategy 版の model SQL が存在する"
    type: file_exists
    path: dbt/models/100-knock/topic-9/mart_orders_incremental_append_100knock.sql
    min_size_bytes: 100
    points: 10

  - id: delete-insert-model-exists
    description: "delete+insert strategy 版の model SQL が存在する"
    type: file_exists
    path: dbt/models/100-knock/topic-9/mart_orders_incremental_delete_insert_100knock.sql
    min_size_bytes: 100
    points: 10

  - id: merge-model-exists
    description: "merge strategy 版の model SQL が存在する"
    type: file_exists
    path: dbt/models/100-knock/topic-9/mart_orders_incremental_merge_100knock.sql
    min_size_bytes: 100
    points: 10

  - id: comparison-doc-exists
    description: "strategy-comparison.md が存在する (300 bytes 以上)"
    type: file_exists
    path: docs/exercises/100-knock/topic-9-performance/strategy-comparison.md
    min_size_bytes: 300
    points: 10

  - id: three-strategies-declared
    description: "3 つの SQL に append / delete+insert / merge の戦略宣言が含まれる"
    type: shell_command
    command: |
      set -euo pipefail
      d=dbt/models/100-knock/topic-9
      grep -q "incremental_strategy='append'" "$d/mart_orders_incremental_append_100knock.sql"
      grep -q "incremental_strategy='delete+insert'" "$d/mart_orders_incremental_delete_insert_100knock.sql"
      grep -q "incremental_strategy='merge'" "$d/mart_orders_incremental_merge_100knock.sql"
      echo "all 3 strategies declared"
    points: 25

  - id: idempotency-keyword-in-doc
    description: "strategy-comparison.md に「冪等」キーワードが含まれる"
    type: shell_command
    command: |
      set -euo pipefail
      grep -q "冪等" docs/exercises/100-knock/topic-9-performance/strategy-comparison.md
      echo "冪等 keyword found"
    points: 15

  - id: dbt-run-three-strategies
    description: "3 つの strategy model がすべて dbt run で成功する"
    type: dbt_command
    command: ["run", "--select", "mart_orders_incremental_append_100knock", "mart_orders_incremental_delete_insert_100knock", "mart_orders_incremental_merge_100knock"]
    points: 20
