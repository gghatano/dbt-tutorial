# Grading for 100-knock Topic 2 / Q9: source-side tests on raw.customers.
# Run: python3 scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-2-raw-load/2-9-source-tests.grading.yaml

exercise: 100-knock-2-9-source-tests
title: "2-9: raw.customers に tests: ブロック (unique / not_null) を source 側に書く"
passing_score: 80

expects_learner_files:
  - dbt/models/100-knock/topic-2/sources.yml

checks:
  - id: sources-yml-exists
    description: "sources.yml が存在する (2-2 で作成済みの前提)"
    type: file_exists
    path: dbt/models/100-knock/topic-2/sources.yml
    points: 5

  - id: sources-yml-has-tests-block
    description: "sources.yml 内に tests: ブロックの記述がある"
    type: shell_command
    command: |
      set -euo pipefail
      grep -E "^\s*tests:\s*$" dbt/models/100-knock/topic-2/sources.yml
    points: 15

  - id: sources-yml-has-unique-on-customer-id
    description: "sources.yml に unique test の記述がある (customer_id 周辺)"
    type: shell_command
    command: |
      set -euo pipefail
      # customer_id ブロック内に unique があることを確認
      python3 - <<'PY'
      import sys, re
      content = open("dbt/models/100-knock/topic-2/sources.yml").read()
      # customer_id 列ブロックを抜き出して unique を含むか
      m = re.search(r"-\s*name:\s*customer_id[\s\S]+?(?=^\s*-\s*name:|\Z)", content, re.MULTILINE)
      if not m:
          print("customer_id column block not found")
          sys.exit(1)
      block = m.group(0)
      if not re.search(r"^\s*-\s*unique\s*:?\s*$", block, re.MULTILINE):
          print("unique test not found under customer_id")
          print("--- block ---")
          print(block)
          sys.exit(1)
      print("ok: unique test found under customer_id")
      PY
    points: 20

  - id: sources-yml-has-not-null-on-customer-id
    description: "sources.yml に not_null test の記述がある (customer_id 周辺)"
    type: shell_command
    command: |
      set -euo pipefail
      python3 - <<'PY'
      import sys, re
      content = open("dbt/models/100-knock/topic-2/sources.yml").read()
      m = re.search(r"-\s*name:\s*customer_id[\s\S]+?(?=^\s*-\s*name:|\Z)", content, re.MULTILINE)
      if not m:
          print("customer_id column block not found")
          sys.exit(1)
      block = m.group(0)
      if not re.search(r"^\s*-\s*not_null\s*:?\s*$", block, re.MULTILINE):
          print("not_null test not found under customer_id")
          print("--- block ---")
          print(block)
          sys.exit(1)
      print("ok: not_null test found under customer_id")
      PY
    points: 20

  - id: source-tests-pass
    description: "dbt test --select source:raw.customers で >= 2 件 PASS する"
    type: dbt_test_passes
    select: "source:raw.customers"
    min_pass: 2
    points: 30

  - id: dbt-parse-passes
    description: "sources.yml の構文が正しく dbt parse が成功する"
    type: dbt_command
    command: ["dbt", "parse"]
    points: 10
