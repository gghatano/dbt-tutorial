# Grading for 100-knock Topic 2 / Q5: trigger dbt source freshness WARN by aging loaded_at.
# Run: python3 scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-2-raw-load/2-5-freshness-warn.grading.yaml

exercise: 100-knock-2-5-freshness-warn
title: "2-5: 故意に loaded_at を過去にして dbt source freshness の WARN を発生させる"
passing_score: 80

expects_learner_files:
  - scripts/100-knock/topic-2/age_orders.py

checks:
  - id: age-script-exists
    description: "scripts/100-knock/topic-2/age_orders.py が存在する"
    type: file_exists
    path: scripts/100-knock/topic-2/age_orders.py
    points: 10

  - id: age-script-runs
    description: "age_orders.py が exit 0 で完了する"
    type: shell_command
    command: ["python3", "scripts/100-knock/topic-2/age_orders.py"]
    points: 20

  - id: orders-loaded-at-aged
    description: "raw.orders.loaded_at の最大値が現在から 24 時間以上前になっている"
    type: sql_assert
    sql: "SELECT (EXTRACT(EPOCH FROM (now() - max(loaded_at))) > 86400)::int FROM raw.orders"
    op: eq
    expected: 1
    points: 20

  - id: orders-loaded-at-not-too-aged
    description: "raw.orders.loaded_at の最大値が現在から 48 時間 (= ERROR 閾値) より新しい (= WARN 領域に居る)"
    type: sql_assert
    sql: "SELECT (EXTRACT(EPOCH FROM (now() - max(loaded_at))) < 172800)::int FROM raw.orders"
    op: eq
    expected: 1
    points: 15

  - id: dbt-source-freshness-warn
    description: "dbt source freshness が WARN を出力する (stdout に WARN を含む、exit 0)"
    type: shell_command
    command: "cd dbt && dbt source freshness --profiles-dir . --select source:raw_100knock.orders 2>&1 | grep -q WARN"
    points: 35
