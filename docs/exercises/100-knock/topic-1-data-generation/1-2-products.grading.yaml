# Grading for 100-knock Topic 1 / Q2: products.csv 100 rows with closed-enum category.
# Run: python3 scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-1-data-generation/1-2-products.grading.yaml

exercise: 100-knock-1-2-products
title: "1-2: products 100 行を生成 (category は 5 値 enum)"
passing_score: 80

expects_learner_files:
  - scripts/100-knock/topic-1/generate_1_2_products.py

checks:
  - id: script-exists
    description: "学習者が generate_1_2_products.py を作成した"
    type: file_exists
    path: scripts/100-knock/topic-1/generate_1_2_products.py
    points: 10

  - id: script-runs
    description: "スクリプト実行が成功する (exit 0)"
    type: shell_command
    command: ["python3", "scripts/100-knock/topic-1/generate_1_2_products.py"]
    points: 15

  - id: csv-row-count
    description: "data/100-knock/topic-1/products.csv が 100 データ行 + ヘッダ"
    type: csv_assert
    path: data/100-knock/topic-1/products.csv
    expect_rows: 100
    expect_columns: [product_id, product_name, category, unit_price]
    points: 20

  - id: csv-pk-unique
    description: "product_id がユニーク"
    type: csv_assert
    path: data/100-knock/topic-1/products.csv
    expect_unique: [product_id]
    points: 15

  - id: csv-no-null-required
    description: "product_id / product_name / category / unit_price に NULL なし"
    type: csv_assert
    path: data/100-knock/topic-1/products.csv
    expect_no_nulls: [product_id, product_name, category, unit_price]
    points: 15

  - id: category-enum-closed
    description: "category 列の distinct 値が 5 値 (food/electronics/clothing/home/sports) のみ"
    type: shell_command
    command: "awk -F, 'NR>1 {print $3}' data/100-knock/topic-1/products.csv | sort -u | tr '\\n' '|'"
    expect_stdout_match: "^(clothing|electronics|food|home|sports)(\\|(clothing|electronics|food|home|sports))*\\|$"
    points: 25
