# Grading for 100-knock Topic 1 / Q3: stores.csv 20 rows with prefecture in 47-set.
# Run: python3 scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-1-data-generation/1-3-stores.grading.yaml

exercise: 100-knock-1-3-stores
title: "1-3: stores 20 行を生成 (prefecture は 47 都道府県)"
passing_score: 80

expects_learner_files:
  - scripts/100-knock/topic-1/generate_1_3_stores.py

checks:
  - id: script-exists
    description: "学習者が generate_1_3_stores.py を作成した"
    type: file_exists
    path: scripts/100-knock/topic-1/generate_1_3_stores.py
    points: 10

  - id: script-runs
    description: "スクリプト実行が成功する (exit 0)"
    type: shell_command
    command: ["python3", "scripts/100-knock/topic-1/generate_1_3_stores.py"]
    points: 15

  - id: csv-row-count
    description: "data/100-knock/topic-1/stores.csv が 20 データ行 + ヘッダ"
    type: csv_assert
    path: data/100-knock/topic-1/stores.csv
    expect_rows: 20
    expect_columns: [store_id, store_name, prefecture]
    points: 20

  - id: csv-pk-unique
    description: "store_id がユニーク"
    type: csv_assert
    path: data/100-knock/topic-1/stores.csv
    expect_unique: [store_id]
    points: 15

  - id: csv-no-null-required
    description: "store_id / store_name / prefecture に NULL なし"
    type: csv_assert
    path: data/100-knock/topic-1/stores.csv
    expect_no_nulls: [store_id, store_name, prefecture]
    points: 15

  - id: prefecture-in-47-set
    description: "prefecture 列の全行が 47 都道府県のいずれかに含まれる (ホワイトリスト外 0 行)"
    type: shell_command
    command: "awk -F, 'NR>1 {print $3}' data/100-knock/topic-1/stores.csv | grep -vxE '北海道|青森県|岩手県|宮城県|秋田県|山形県|福島県|茨城県|栃木県|群馬県|埼玉県|千葉県|東京都|神奈川県|新潟県|富山県|石川県|福井県|山梨県|長野県|岐阜県|静岡県|愛知県|三重県|滋賀県|京都府|大阪府|兵庫県|奈良県|和歌山県|鳥取県|島根県|岡山県|広島県|山口県|徳島県|香川県|愛媛県|高知県|福岡県|佐賀県|長崎県|熊本県|大分県|宮崎県|鹿児島県|沖縄県' | wc -l | tr -d ' '"
    expect_stdout_match: "^0$"
    points: 25
