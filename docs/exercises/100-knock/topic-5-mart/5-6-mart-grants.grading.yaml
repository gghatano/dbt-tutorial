# Grading for 100-knock Topic 5 / Q6: +grants: config で readonly_user に SELECT 自動付与 (hook 不要)
# Run: python3 scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-5-mart/5-6-mart-grants.grading.yaml
#
# 採点方針:
#   - 構造チェック (dbt_project.yml に grants ブロック)        20
#   - 動作チェック (dbt build 成功 + apply grants ログ + has_table_privilege)  65
#   - 反証チェック (新規 on-run-end hook が増えていない)        15
#   合計 100、合格 80

exercise: 100-knock-5-6-mart-grants
title: "5-6: mart に +grants: 宣言を付け readonly_user に SELECT 自動付与 (hook 不要)"
passing_score: 80

expects_learner_files:
  - dbt/dbt_project.yml

checks:
  # ----- 構造チェック (20点) -----

  - id: grants-block-in-project-yml
    description: "dbt/dbt_project.yml の models 配下に +grants: ブロック + readonly_user が宣言されている"
    type: shell_command
    command: |
      set -euo pipefail
      grants_lines=$(grep -cE '^\s*\+?grants:' dbt/dbt_project.yml || echo 0)
      ro_lines=$(grep -cE 'readonly_user' dbt/dbt_project.yml || echo 0)
      echo "grants_lines=${grants_lines} readonly_user_lines=${ro_lines}"
      test "${grants_lines}" -ge 1
      test "${ro_lines}" -ge 1
    points: 20

  # ----- 動作チェック (65点) -----

  - id: dbt-build-100knock-marts-success
    description: "dbt build --select 100-knock.topic-5 が成功する (grants 宣言込みで)"
    type: shell_command
    command: |
      set -euo pipefail
      cd dbt
      dbt build --select 100-knock.topic-5 --profiles-dir . 2>&1 | tee /tmp/5-6-build.log
      grep -E 'ERROR=0' /tmp/5-6-build.log >/dev/null
      ! grep -E 'ERROR=[1-9]' /tmp/5-6-build.log >/dev/null
    points: 25

  - id: apply-grants-log-line
    description: "dbt build のログに 'applied grants' (= +grants: が発火した証跡) が出ている"
    type: shell_command
    command: |
      set -euo pipefail
      cd dbt
      dbt build --select 100-knock.topic-5 --profiles-dir . 2>&1 | tee /tmp/5-6-grants.log
      n=$(grep -c 'applied grants' /tmp/5-6-grants.log || echo 0)
      echo "apply_grants_lines=${n}"
      test "${n}" -ge 1
    points: 15

  - id: readonly-can-select-mart
    description: "readonly_user が marts.mart_top_rated_products_100knock に SELECT 権限を持つ"
    type: sql_assert
    sql: "SELECT has_table_privilege('readonly_user', 'marts.mart_top_rated_products_100knock', 'SELECT')::int"
    op: eq
    expected: 1
    points: 25

  # ----- 反証チェック (15点): hook を追加していない (= 宣言的解だけで実現) -----

  - id: no-on-run-end-hook-added
    description: "dbt_project.yml に on-run-end: の grant_select 系 hook が追加されていない (本問は宣言的解単体)"
    type: shell_command
    command: |
      set -euo pipefail
      # on-run-end ブロック自体は他用途で存在する可能性があるため、
      # 「grant_select_on_marts」や「grant select」系の SQL/macro 呼び出しが
      # on-run-end ブロックに含まれていないことだけを確認する。
      # 簡易的には dbt_project.yml に grant_select_on_marts() の呼び出しがないことで判定。
      n=$(grep -cE 'grant_select_on_marts|grant select on all tables' dbt/dbt_project.yml || echo 0)
      echo "hook_grant_calls=${n}"
      test "${n}" -eq 0
    points: 15
