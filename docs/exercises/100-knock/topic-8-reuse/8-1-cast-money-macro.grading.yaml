# Grading definition for 100-knock Topic 8, Problem 8-1 (cast_money macro 引数化 + 5 model から呼び出し).
# Run by: python scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-8-reuse/8-1-cast-money-macro.grading.yaml
#
# 採点方針:
#   - 構造チェック (file_exists / parse / shell grep) で 50 点
#   - 実行チェック (dbt run + sql_assert で物理型維持) で 50 点
#
# 前提:
#   - Topic ② 〜 ⑦ 完了 (5 model が物理化済み)
#   - 学習者が dbt/macros/100-knock/topic-8/cast_money.sql を作成
#   - 5 model の金額系 cast を {{ cast_money(...) }} に置換済み

exercise: 100-knock-8-1-cast-money-macro
title: "100-knock 8-1: cast_money macro を桁数引数化、5 model から呼び出す"
passing_score: 80

expects_learner_files:
  - dbt/macros/100-knock/topic-8/cast_money.sql
  - dbt/models/100-knock/topic-3/stg_orders_100knock.sql
  - dbt/models/100-knock/topic-3/stg_products_100knock.sql
  - dbt/models/100-knock/topic-4/int_order_details_100knock.sql
  - dbt/models/100-knock/topic-5/mart_top_rated_products_100knock.sql
  - dbt/models/100-knock/topic-5/mart_monthly_by_category_100knock.sql

checks:
  # ----- 構造チェック (50 点) -----

  - id: cast-money-macro-file-exists
    description: "dbt/macros/100-knock/topic-8/cast_money.sql が存在する"
    type: file_exists
    path: dbt/macros/100-knock/topic-8/cast_money.sql
    min_size_bytes: 60
    points: 10

  - id: parse-success
    description: "dbt parse が成功する (cast_money macro の構文 OK)"
    type: dbt_command
    command: ["parse"]
    points: 10

  - id: cast-money-called-in-5-models
    description: "5 model の SQL で {{ cast_money(...) }} を合計 5 回以上呼び出している"
    type: shell_command
    command: |
      set -euo pipefail
      n=$(grep -cE 'cast_money\(' \
            dbt/models/100-knock/topic-3/stg_orders_100knock.sql \
            dbt/models/100-knock/topic-3/stg_products_100knock.sql \
            dbt/models/100-knock/topic-4/int_order_details_100knock.sql \
            dbt/models/100-knock/topic-5/mart_top_rated_products_100knock.sql \
            dbt/models/100-knock/topic-5/mart_monthly_by_category_100knock.sql \
          | awk -F: '{s+=$2} END {print s+0}')
      echo "cast_money_calls_total=${n}"
      test "${n}" -ge 5
    points: 20

  - id: cast-money-macro-has-default-args
    description: "cast_money macro が precision / scale のデフォルト値を持つ ( =14, =2 )"
    type: shell_command
    command: |
      set -euo pipefail
      grep -E 'precision\s*=\s*14' dbt/macros/100-knock/topic-8/cast_money.sql >/dev/null
      grep -E 'scale\s*=\s*2'      dbt/macros/100-knock/topic-8/cast_money.sql >/dev/null
      echo "default_args_ok"
    points: 10

  # ----- 実行チェック (50 点) -----

  - id: dbt-run-5-models
    description: "dbt run --select <5 models> が PASS=5 で成功する"
    type: dbt_command
    command:
      - "run"
      - "--select"
      - "stg_orders_100knock"
      - "stg_products_100knock"
      - "int_order_details_100knock"
      - "mart_top_rated_products_100knock"
      - "mart_monthly_by_category_100knock"
    points: 15

  - id: stg-orders-unit-price-numeric-10-2
    description: "staging.stg_orders_100knock.unit_price の物理型が numeric(10, 2) を維持"
    type: sql_assert
    sql: |
      SELECT count(*)::int FROM information_schema.columns
       WHERE table_schema='staging' AND table_name='stg_orders_100knock'
         AND column_name='unit_price'
         AND data_type='numeric' AND numeric_precision=10 AND numeric_scale=2
    op: eq
    expected: 1
    points: 15

  - id: int-order-details-sales-amount-numeric-14-2
    description: "intermediate.int_order_details_100knock.sales_amount の物理型が numeric(14, 2)"
    type: sql_assert
    sql: |
      SELECT count(*)::int FROM information_schema.columns
       WHERE table_schema='intermediate' AND table_name='int_order_details_100knock'
         AND column_name='sales_amount'
         AND data_type='numeric' AND numeric_precision=14 AND numeric_scale=2
    op: eq
    expected: 1
    points: 20
