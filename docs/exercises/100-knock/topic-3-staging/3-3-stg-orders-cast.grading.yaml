# Grading definition for 100-knock Topic 3, Problem 3-3 (stg_orders + explicit casts).
# Run by: python scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-3-staging/3-3-stg-orders-cast.grading.yaml
#
# 採点方針:
#   - 構造チェック (file_exists / parse / manifest) で 35 点
#   - データチェック (sql_assert で物理型 + 行数) で 65 点
#   - 「staging が公開する物理型」を information_schema で検証することで、明示 cast が
#     ちゃんと効いていることをデータ側から確認する
#
# 前提:
#   - 3-1 / 3-2 完了 (Topic ③ 作法の基本が身についている)
#   - Topic ② 2-1〜2-5 完了 (raw_100knock.orders source 宣言済み, raw.orders に 10,000 行)

exercise: 100-knock-3-3-stg-orders-cast
title: "100-knock 3-3: stg_orders で order_date / unit_price を明示 cast"
passing_score: 80

expects_learner_files:
  - dbt/models/100-knock/topic-3/stg_orders_100knock.sql
  - dbt/models/100-knock/topic-3/schema.yml

checks:
  # ----- 構造チェック (35 点) -----

  - id: stg-orders-file-exists
    description: "dbt/models/100-knock/topic-3/stg_orders_100knock.sql が存在する"
    type: file_exists
    path: dbt/models/100-knock/topic-3/stg_orders_100knock.sql
    points: 10

  - id: parse-success
    description: "dbt parse が成功する (新 model の SQL / Jinja 構文 OK)"
    type: dbt_command
    command: ["dbt", "parse"]
    points: 10

  - id: stg-orders-node-registered
    description: "manifest に model.local_analytics.stg_orders_100knock が登録されている"
    type: manifest_node_exists
    node: model.local_analytics.stg_orders_100knock
    points: 15

  # ----- データチェック (65 点) -----

  - id: stg-orders-row-count
    description: "staging.stg_orders_100knock が 10000 行ある (Topic ① 1-4 の生成行数)"
    type: sql_assert
    sql: "SELECT count(*) FROM staging.stg_orders_100knock"
    op: eq
    expected: 10000
    points: 15

  - id: order-date-is-date
    description: "order_date 列の物理型が date (明示 cast が効いている)"
    type: sql_assert
    sql: "SELECT data_type FROM information_schema.columns WHERE table_schema='staging' AND table_name='stg_orders_100knock' AND column_name='order_date'"
    op: eq
    expected: "date"
    points: 25

  - id: unit-price-is-numeric-10-2
    description: "unit_price 列が numeric(10, 2) (precision=10, scale=2) で物理化されている"
    type: sql_assert
    sql: "SELECT numeric_precision || ',' || numeric_scale FROM information_schema.columns WHERE table_schema='staging' AND table_name='stg_orders_100knock' AND column_name='unit_price'"
    op: eq
    expected: "10,2"
    points: 25
