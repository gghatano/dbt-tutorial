# Grading definition for 100-knock Topic 3, Problem 3-5 (custom generic test: positive_value).
# Run by: python scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-3-staging/3-5-positive-value-generic.grading.yaml
#
# 採点方針:
#   - 構造チェック (file_exists / parse / manifest 上の test 存在) で 45 点
#   - データチェック (dbt_test_passes で実 SQL 検査) で 55 点
#   - Ex.08 を先にやっていて test_positive_value.sql が既にあれば、新規作成は不要
#
# 前提:
#   - 3-1 / 3-2 / 3-3 / 3-4 完了 (3 staging model + schema.yml の built-in test が PASS)
#   - 学習者は dbt/tests/generic/test_positive_value.sql を作成 (Ex.08 と同じファイル可)
#   - schema.yml で stg_orders_100knock の quantity / unit_price に positive_value を適用済み

exercise: 100-knock-3-5-positive-value-generic
title: "100-knock 3-5: 自作 generic test positive_value を stg_orders に適用"
passing_score: 80

expects_learner_files:
  - dbt/tests/generic/test_positive_value.sql
  - dbt/models/100-knock/topic-3/schema.yml

checks:
  # ----- 構造チェック (45 点) -----

  - id: positive-value-test-file-exists
    description: "dbt/tests/generic/test_positive_value.sql が存在する"
    type: file_exists
    path: dbt/tests/generic/test_positive_value.sql
    points: 15

  - id: parse-success
    description: "dbt parse が成功する (generic test の Jinja 構文 OK)"
    type: dbt_command
    command: ["dbt", "parse"]
    points: 10

  - id: positive-value-quantity-test-registered
    description: "manifest に positive_value test (stg_orders_100knock.quantity) が登録されている"
    type: manifest_node_exists
    node: test.local_analytics.positive_value_stg_orders_100knock_quantity
    points: 10

  - id: positive-value-unit-price-test-registered
    description: "manifest に positive_value test (stg_orders_100knock.unit_price) が登録されている"
    type: manifest_node_exists
    node: test.local_analytics.positive_value_stg_orders_100knock_unit_price
    points: 10

  # ----- データチェック (55 点) -----

  - id: stg-orders-tests-pass-with-positive-value
    description: "stg_orders_100knock の test が PASS (positive_value 2 件 + built-in を含む 8 件以上)"
    type: dbt_test_passes
    select: stg_orders_100knock
    min_pass: 8
    points: 30

  - id: positive-value-violation-zero-quantity
    description: "raw.orders に quantity <= 0 の行が存在しない (Topic ① の生成前提)"
    type: sql_assert
    sql: "SELECT count(*) FROM staging.stg_orders_100knock WHERE quantity is null OR quantity <= 0"
    op: eq
    expected: 0
    points: 12

  - id: positive-value-violation-zero-unit-price
    description: "stg_orders_100knock に unit_price <= 0 の行が存在しない"
    type: sql_assert
    sql: "SELECT count(*) FROM staging.stg_orders_100knock WHERE unit_price is null OR unit_price <= 0"
    op: eq
    expected: 0
    points: 13
