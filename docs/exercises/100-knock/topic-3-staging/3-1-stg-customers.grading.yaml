# Grading definition for 100-knock Topic 3, Problem 3-1 (stg_customers as view).
# Run by: python scripts/grader/grade.py --grading-file docs/exercises/100-knock/topic-3-staging/3-1-stg-customers.grading.yaml
#
# 採点方針:
#   - 構造チェック (file_exists / parse / manifest) で 50 点
#   - データチェック (dbt_test_passes) で 50 点
#   - 学習者は 3-1 の stg_customers_100knock.sql + 最低限の schema.yml をコミット済み
#
# 前提:
#   - Topic ② 2-1〜2-5 完了 (raw_100knock source が宣言済み, raw.customers に 1000 行)
#   - 学習者は dbt/models/100-knock/topic-3/stg_customers_100knock.sql を作成
#   - dbt parse / dbt run / dbt test がローカルまたは CI で走る環境

exercise: 100-knock-3-1-stg-customers
title: "100-knock 3-1: stg_customers を view materialization で書く"
passing_score: 80

expects_learner_files:
  - dbt/models/100-knock/topic-3/stg_customers_100knock.sql
  - dbt/models/100-knock/topic-3/schema.yml

checks:
  # ----- 構造チェック (50 点) -----

  - id: stg-customers-file-exists
    description: "dbt/models/100-knock/topic-3/stg_customers_100knock.sql が存在する"
    type: file_exists
    path: dbt/models/100-knock/topic-3/stg_customers_100knock.sql
    points: 15

  - id: parse-success
    description: "dbt parse が成功する (新 model の SQL / Jinja 構文 OK)"
    type: dbt_command
    command: ["dbt", "parse"]
    points: 15

  - id: stg-customers-node-registered
    description: "manifest に model.local_analytics.stg_customers_100knock が登録されている"
    type: manifest_node_exists
    node: model.local_analytics.stg_customers_100knock
    points: 20

  # ----- データチェック (50 点) -----

  - id: stg-customers-row-count
    description: "staging.stg_customers_100knock が 1000 行ある (Topic ① の生成行数)"
    type: sql_assert
    sql: "SELECT count(*) FROM staging.stg_customers_100knock"
    op: eq
    expected: 1000
    points: 20

  - id: stg-customers-tests-pass
    description: "dbt test --select stg_customers_100knock が PASS (not_null + unique)"
    type: dbt_test_passes
    select: stg_customers_100knock
    min_pass: 2
    points: 30
